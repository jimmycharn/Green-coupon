<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Green Coupon — แอปทำงานอย่างไร</title>
  <desc id="desc">อินโฟกราฟิกสถาปัตยกรรมและการไหลของข้อมูลของแอป Green Coupon ตั้งแต่ผู้ใช้ผ่านเว็บเบราว์เซอร์ไปยัง Supabase และบริการเว็บที่เกี่ยวข้อง</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="0.55" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="supabase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .thai { font-family: 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: -1px; }
      .subtitle { font-size: 25px; font-weight: 400; }
      .section { font-size: 31px; font-weight: 800; }
      .cardTitle { font-size: 25px; font-weight: 800; }
      .body { font-size: 20px; font-weight: 500; }
      .small { font-size: 17px; font-weight: 500; }
      .tiny { font-size: 15px; font-weight: 500; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
      .green { fill: #047857; }
      .blue { fill: #1d4ed8; }
      .purple { fill: #6d28d9; }
      .orange { fill: #c2410c; }
      .line { stroke: #cbd5e1; stroke-width: 2; }
      .dashed { stroke-dasharray: 9 8; }
    </style>
  </defs>

